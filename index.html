
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Courier Tracking Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
    }
    button {
      background: #1677e8;
      color: white;
      border: 0;
      padding: 14px 25px;
      border-radius: 8px;
      font-size: 16px;
      margin: 10px;
    }
    #reader { width: 100%; }
    #status { margin: 15px; }
    li { text-align: left; padding: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Courier Tracking Scanner</h2>
    <p>Barcode को कैमरे के सामने रखें</p>

    <div id="reader"></div>
<label for="platform">Select Platform:</label>

<select id="platform" onchange="toggleOtherPlatform()">
  <option value="">Select Platform</option>
  <option value="AJIO">AJIO</option>
  <option value="Myntra">Myntra</option>
  <option value="Flipkart">Flipkart</option>
  <option value="Amazon">Amazon</option>
  <option value="Meesho">Meesho</option>
  <option value="Snapdeal">Snapdeal</option>
  <option value="LimeRoad">LimeRoad</option>
  <option value="Others">Others</option>
</select>

<input
  type="text"
  id="otherPlatform"
  placeholder="Enter Platform Name"
  style="display:none;"
>
    <p id="status">Scanner शुरू करने के लिए बटन दबाएं</p>

    <button onclick="startScanner()">Start Scanner</button>
    <button onclick="stopScanner()">Stop Scanner</button>

    <h3>Scanned Tracking IDs</h3>
    <ol id="results"></ol>
  </div>

  <script>
    let scanner;
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbybkoQKmdklnwK6vEJA1WuMUvJAm7Sfq-YXHYc_2jqtlPnaLeUWvz9VNztcVRe7djuKHA/exec";
    let lastCode = "";
    let lastTime = 0;
function toggleOtherPlatform() {
  const platform = document.getElementById("platform").value;
  const otherBox = document.getElementById("otherPlatform");

  if (platform === "Others") {
    otherBox.style.display = "block";
  } else {
    otherBox.style.display = "none";
    otherBox.value = "";
  }
}
    async function startScanner() {
      const selectedPlatform = document.getElementById("platform").value;
const otherPlatform = document.getElementById("otherPlatform").value.trim();

if (!selectedPlatform || (selectedPlatform === "Others" && !otherPlatform)) {
  alert("Please select a platform or enter platform name");
  return;
}
      try {
        if (!scanner) {
          scanner = new Html5Qrcode("reader");
        }

        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 280, height: 150 } },
          function(decodedText) {
            const now = Date.now();

            if (decodedText === lastCode &&
                now - lastTime < 3000) return;

            lastCode = decodedText;
            lastTime = now;

            document.getElementById("status").innerText =
              "Scanned: " + decodedText;

            const li = document.createElement("li");
            li.textContent = decodedText;
            document.getElementById("results").prepend(li);
          
fetch(GOOGLE_SCRIPT_URL, {
  method: "POST",
  mode: "no-cors",
  headers: {
    "Content-Type": "text/plain;charset=utf-8"
  },
  body: JSON.stringify({
    trackingId: decodedText,
platform: document.getElementById("platform").value === "Others"
  ? document.getElementById("otherPlatform").value.trim()
  : document.getElementById("platform").value
  })
});

          }
        );

        document.getElementById("status").innerText =
          "Camera चालू है - Scan करें";
      } catch(error) {
        document.getElementById("status").innerText =
          "Camera Error: " + error;
      }
    }

    async function stopScanner() {
      if (scanner && scanner.isScanning) {
        await scanner.stop();
        document.getElementById("status").innerText =
          "Scanner बंद है";
      }
    }
  </script>
</body>
</html>
